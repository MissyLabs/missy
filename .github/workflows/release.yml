name: Native release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build native Linux package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Native build and disposable test prerequisites
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=20 install -y --no-install-recommends libopus-dev pkg-config ffmpeg xvfb xauth dbus nodejs poppler-utils tesseract-ocr
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo build --release -p missy-cli --locked
      - name: Package executable with operator assets and notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/package
          cp target/release/missy-rs README-RUST.md Cargo.lock dist/package/
          cp -R packaging docs/rust examples dist/package/
          cargo metadata --locked --format-version 1 > dist/package/dependency-metadata.json
          (cd dist/package && sha256sum missy-rs > SHA256SUMS)
          tar -czf "dist/missy-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" -C dist/package .
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-dist
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS

  github-release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
